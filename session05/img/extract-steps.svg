<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="290" viewBox="0 0 1160 290"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 5つの段階 -->
  <rect x="0" y="20" width="210" height="100" rx="12" fill="#1e40af"/>
  <text x="105" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="white">① 単語に分ける</text>
  <text x="105" y="94" text-anchor="middle" font-size="15" fill="#bfdbfe">tokenize()　23行</text>

  <polygon points="230,70 216,61 216,79" fill="#93c5fd"/>

  <rect x="237" y="20" width="210" height="100" rx="12" fill="#1e40af"/>
  <text x="342" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="white">② 品詞で選ぶ</text>
  <text x="342" y="94" text-anchor="middle" font-size="15" fill="#bfdbfe">25〜29行</text>

  <polygon points="467,70 453,61 453,79" fill="#93c5fd"/>

  <rect x="474" y="20" width="210" height="100" rx="12" fill="#1e40af"/>
  <text x="579" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="white">③ 基本形・小文字</text>
  <text x="579" y="94" text-anchor="middle" font-size="15" fill="#bfdbfe">32〜37行</text>

  <polygon points="704,70 690,61 690,79" fill="#93c5fd"/>

  <rect x="711" y="20" width="210" height="100" rx="12" fill="#1e40af"/>
  <text x="816" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="white">④ ストップワード</text>
  <text x="816" y="76" text-anchor="middle" font-size="19" font-weight="bold" fill="white">を除く</text>
  <text x="816" y="104" text-anchor="middle" font-size="15" fill="#bfdbfe">39〜40行</text>

  <polygon points="941,70 927,61 927,79" fill="#93c5fd"/>

  <rect x="948" y="20" width="212" height="100" rx="12" fill="#1e40af"/>
  <text x="1054" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="white">⑤ 同じ語は1回</text>
  <text x="1054" y="94" text-anchor="middle" font-size="15" fill="#bfdbfe">41〜42行</text>

  <!-- 例 -->
  <text x="0" y="158" font-size="17" fill="#94a3b8">例：「SQLiteに保存するには？」（search.py 20行のコメントと同じ）</text>

  <rect x="0" y="172" width="210" height="104" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="105" y="206" text-anchor="middle" font-size="18" fill="white">SQLite に 保存</text>
  <text x="105" y="234" text-anchor="middle" font-size="18" fill="white">する に は ？</text>
  <text x="105" y="262" text-anchor="middle" font-size="15" fill="#94a3b8">7個のトークン</text>

  <rect x="237" y="172" width="210" height="104" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="342" y="206" text-anchor="middle" font-size="18" fill="white">SQLite 保存 する</text>
  <text x="342" y="234" text-anchor="middle" font-size="15" fill="#94a3b8">助詞「に」「は」と</text>
  <text x="342" y="258" text-anchor="middle" font-size="15" fill="#94a3b8">記号「？」を捨てる</text>

  <rect x="474" y="172" width="210" height="104" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="579" y="206" text-anchor="middle" font-size="18" fill="white">sqlite 保存 する</text>
  <text x="579" y="234" text-anchor="middle" font-size="15" fill="#94a3b8">SQLite → sqlite</text>
  <text x="579" y="258" text-anchor="middle" font-size="15" fill="#94a3b8">「閉じ」→「閉じる」も</text>

  <rect x="711" y="172" width="210" height="104" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="816" y="206" text-anchor="middle" font-size="18" fill="white">sqlite 保存</text>
  <text x="816" y="234" text-anchor="middle" font-size="15" fill="#94a3b8">「する」を捨てる</text>

  <rect x="948" y="172" width="212" height="104" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="1054" y="206" text-anchor="middle" font-size="18" font-weight="bold" fill="#fcd34d">['sqlite', '保存']</text>
  <text x="1054" y="234" text-anchor="middle" font-size="15" fill="#94a3b8">これが検索語</text>
</svg>
