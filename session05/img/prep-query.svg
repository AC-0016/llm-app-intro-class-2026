<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="350" viewBox="0 0 1160 350"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 準備 -->
  <text x="0" y="24" font-size="20" font-weight="bold" fill="#5eead4">準備（python init_db.py）</text>
  <text x="262" y="24" font-size="17" fill="#94a3b8">資料を直したときに1回</text>

  <rect x="0" y="40" width="250" height="92" rx="12" fill="#0f766e"/>
  <text x="125" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="white">data/session01.md</text>
  <text x="125" y="110" text-anchor="middle" font-size="17" fill="#ccfbf1">スライド36枚</text>

  <path d="M252 86 H286" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="300,86 286,77 286,95" fill="#93c5fd"/>

  <rect x="302" y="40" width="250" height="92" rx="12" fill="#334155"/>
  <text x="427" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="white">1枚ずつに分ける</text>
  <text x="427" y="110" text-anchor="middle" font-size="16" fill="#94a3b8">read_all_slides()（前回）</text>

  <path d="M554 86 H588" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="602,86 588,77 588,95" fill="#93c5fd"/>

  <rect x="604" y="40" width="250" height="92" rx="12" fill="#1e40af" stroke="#f59e0b" stroke-width="4"/>
  <text x="729" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="white">単語に分ける</text>
  <text x="729" y="110" text-anchor="middle" font-size="16" fill="#fcd34d">add_words() → extract_words()</text>

  <path d="M856 86 H890" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="904,86 890,77 890,95" fill="#93c5fd"/>

  <rect x="906" y="40" width="254" height="92" rx="12" fill="#334155"/>
  <text x="1033" y="78" text-anchor="middle" font-size="19" font-weight="bold" fill="white">documents.db</text>
  <text x="1033" y="110" text-anchor="middle" font-size="16" fill="#e2e8f0">words 列に単語のリスト</text>

  <!-- 起動時に読み込む -->
  <path d="M1033 134 V166 H729 V196" stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  <polygon points="729,210 720,196 738,196" fill="#94a3b8"/>
  <text x="760" y="190" font-size="16" fill="#cbd5e1">サーバーの起動時に読み込む（main.py 62行）</text>

  <!-- 質問のとき -->
  <text x="0" y="190" font-size="20" font-weight="bold" fill="#fdba74">質問のとき（main.py の ask()）</text>
  <text x="318" y="190" font-size="17" fill="#94a3b8">質問のたびに</text>

  <rect x="0" y="212" width="250" height="92" rx="12" fill="#b45309"/>
  <text x="125" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="white">質問</text>
  <text x="125" y="282" text-anchor="middle" font-size="16" fill="#fef3c7">学習と推論の違いは？</text>

  <path d="M252 258 H286" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="300,258 286,249 286,267" fill="#93c5fd"/>

  <rect x="302" y="212" width="250" height="92" rx="12" fill="#1e40af" stroke="#f59e0b" stroke-width="4"/>
  <text x="427" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="white">検索語を取り出す</text>
  <text x="427" y="282" text-anchor="middle" font-size="16" fill="#fcd34d">extract_words()</text>

  <path d="M554 258 H588" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="602,258 588,249 588,267" fill="#93c5fd"/>

  <rect x="604" y="212" width="250" height="92" rx="12" fill="#1e40af"/>
  <text x="729" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="white">words と比べる</text>
  <text x="729" y="282" text-anchor="middle" font-size="16" fill="#dbeafe">search_documents()</text>

  <path d="M856 258 H890" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="904,258 890,249 890,267" fill="#93c5fd"/>

  <rect x="906" y="212" width="254" height="92" rx="12" fill="#334155"/>
  <text x="1033" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="white">LLMに答えさせる</text>
  <text x="1033" y="282" text-anchor="middle" font-size="16" fill="#94a3b8">ask_with_documents()（前回）</text>

  <text x="0" y="338" font-size="18" fill="#fcd34d">オレンジの枠：質問も資料も、同じ extract_words() で単語にする</text>
</svg>
