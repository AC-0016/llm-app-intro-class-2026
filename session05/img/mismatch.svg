<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="300" viewBox="0 0 1160 300"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <text x="0" y="38" font-size="19" font-weight="bold" fill="white">「LLMが前の話を忘れるのはなぜ？」</text>
  <rect x="0" y="54" width="53" height="38" rx="8" fill="#0f766e"/>
  <text x="27" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="white">llm</text>
  <rect x="63" y="54" width="40" height="38" rx="8" fill="#0f766e"/>
  <text x="83" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="white">前</text>
  <rect x="113" y="54" width="40" height="38" rx="8" fill="#0f766e"/>
  <text x="133" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="white">話</text>
  <rect x="163" y="54" width="76" height="38" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="201" y="80" text-anchor="middle" font-size="18" fill="#94a3b8">忘れる</text>
  <path d="M420 73 H520" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="534,73 520,64 520,82" fill="#93c5fd"/>
  <text x="550" y="66" font-size="20" font-weight="bold" fill="#5eead4">13枚目は3点 → 1位で渡る</text>
  <text x="550" y="96" font-size="17" fill="#cbd5e1">（35枚目も3点。同点はID順）</text>

  <text x="0" y="146" font-size="19" font-weight="bold" fill="white">「LLMの記憶力は？」</text>
  <rect x="0" y="162" width="53" height="38" rx="8" fill="#0f766e"/>
  <text x="27" y="188" text-anchor="middle" font-size="18" font-weight="bold" fill="white">llm</text>
  <rect x="63" y="162" width="58" height="38" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="92" y="188" text-anchor="middle" font-size="18" fill="#94a3b8">記憶</text>
  <path d="M420 181 H520" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="534,181 520,172 520,190" fill="#93c5fd"/>
  <text x="550" y="174" font-size="20" font-weight="bold" fill="#fca5a5">13枚目は1点。36件すべてが1点</text>
  <text x="550" y="204" font-size="17" fill="#cbd5e1">→ ID順で1・2・3枚目が渡り、13枚目は渡らない</text>

  <rect x="0" y="236" width="1160" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="18" y="262" font-size="17" fill="#cbd5e1">13枚目「LLMは前の会話を覚えていない」の words：llm、前、会話、<tspan fill="#fcd34d" font-weight="bold">覚える</tspan>、モデル、…、話、…</text>
  <text x="18" y="286" font-size="17" fill="#94a3b8">緑は13枚目の words にある語。点線は無い語。「忘れる」「記憶」は、意味が近くても別の語なので一致しない。</text>
</svg>
