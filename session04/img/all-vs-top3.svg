<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="290" viewBox="0 0 1160 290"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <defs>
    <!-- 資料1件 = 1マス。6×6 で36件 -->
    <pattern id="all" width="36" height="36" patternUnits="userSpaceOnUse" x="143" y="44">
      <rect width="30" height="30" rx="4" fill="#0f766e"/>
    </pattern>
    <pattern id="dim" width="36" height="36" patternUnits="userSpaceOnUse" x="803" y="44">
      <rect width="30" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 全部渡す -->
  <text x="250" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="white">36件を全部渡す</text>
  <rect x="143" y="44" width="210" height="210" fill="url(#all)"/>
  <text x="250" y="282" text-anchor="middle" font-size="20" fill="#fcd34d">入力 約7,800文字</text>

  <!-- 矢印 -->
  <text x="580" y="130" text-anchor="middle" font-size="18" fill="#cbd5e1">次回：検索で絞る</text>
  <path d="M500 150 H646" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="660,150 644,140 644,160" fill="#93c5fd"/>

  <!-- 上位3件 -->
  <text x="910" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="white">上位3件だけ渡す（TOP_K = 3）</text>
  <rect x="803" y="44" width="210" height="210" fill="url(#dim)"/>
  <!-- 「学習と推論の違いは？」で選ばれる 2・7・12枚目 -->
  <rect x="839" y="44" width="30" height="30" rx="4" fill="#14b8a6"/>
  <rect x="803" y="80" width="30" height="30" rx="4" fill="#14b8a6"/>
  <rect x="983" y="80" width="30" height="30" rx="4" fill="#14b8a6"/>
  <text x="910" y="282" text-anchor="middle" font-size="20" fill="#fcd34d">「学習と推論の違いは？」なら約600文字</text>
</svg>
