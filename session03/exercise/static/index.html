<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チャットアプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">LLM APP INTRO / 2026</p>
    <h1>チャットアプリ</h1>
    <p>これまでの会話を毎回まとめて送るので、LLMが前の話を踏まえて答えます。</p>
  </header>
  <p>会話の内容を外部APIへ送信します。</p>

  <section>
    <h2>会話</h2>
    <ul id="messages"></ul>
  </section>

  <form id="chat-form">
    <label for="question">質問</label>
    <textarea id="question" maxlength="500" required rows="3" placeholder="私の名前は佐藤です。"></textarea>
    <div class="buttons">
      <button id="send-button" type="submit">送信</button>
      <button id="reset-button" type="button" class="secondary">会話をリセット</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <footer>教材用です。個人情報や秘密情報を入力しないでください。</footer>
</main>
</body>
</html>
