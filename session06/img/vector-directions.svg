<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="330" viewBox="0 0 1160 330"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 座標 -->
  <rect x="0" y="0" width="470" height="330" rx="14" fill="#1e293b"/>
  <path d="M30 210 H440" stroke="#475569" stroke-width="2"/>
  <path d="M230 30 V310" stroke="#475569" stroke-width="2"/>
  <text x="446" y="215" font-size="15" fill="#94a3b8">x</text>
  <text x="236" y="36" font-size="15" fill="#94a3b8">y</text>
  <!-- 目盛り（1目盛り = 90px） -->
  <path d="M320 204 V216 M410 204 V216 M140 204 V216 M224 120 H236" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-size="14" fill="#94a3b8">1</text>
  <text x="410" y="236" text-anchor="middle" font-size="14" fill="#94a3b8">2</text>
  <text x="140" y="236" text-anchor="middle" font-size="14" fill="#94a3b8">-1</text>
  <text x="216" y="125" text-anchor="end" font-size="14" fill="#94a3b8">1</text>

  <!-- b = [2, 0]（a と重なるので上にずらして描く） -->
  <path d="M230 186 H396" stroke="#2dd4bf" stroke-width="5" fill="none"/>
  <polygon points="412,186 394,176 394,196" fill="#2dd4bf"/>
  <text x="330" y="172" font-size="18" font-weight="bold" fill="#2dd4bf">b [2, 0]</text>

  <!-- a = [1, 0] -->
  <path d="M230 210 H306" stroke="#60a5fa" stroke-width="5" fill="none"/>
  <polygon points="322,210 304,200 304,220" fill="#60a5fa"/>
  <text x="246" y="262" font-size="18" font-weight="bold" fill="#60a5fa">a [1, 0]</text>

  <!-- c = [0, 1] -->
  <path d="M230 210 V136" stroke="#f59e0b" stroke-width="5" fill="none"/>
  <polygon points="230,120 220,138 240,138" fill="#f59e0b"/>
  <text x="246" y="112" font-size="18" font-weight="bold" fill="#f59e0b">c [0, 1]</text>

  <!-- d = [-1, 0] -->
  <path d="M230 210 H156" stroke="#f472b6" stroke-width="5" fill="none"/>
  <polygon points="140,210 158,200 158,220" fill="#f472b6"/>
  <text x="66" y="262" font-size="18" font-weight="bold" fill="#f472b6">d [-1, 0]</text>

  <circle cx="230" cy="210" r="5" fill="#e2e8f0"/>
  <text x="16" y="318" font-size="14" fill="#94a3b8">b は a と同じ直線上。重ならないよう少し上にずらして描いています</text>

  <!-- 表 -->
  <text x="510" y="44" font-size="17" fill="#94a3b8">a と比べる</text>
  <text x="700" y="44" font-size="17" fill="#94a3b8">向きの関係</text>
  <text x="1060" y="44" font-size="17" fill="#94a3b8" text-anchor="middle">類似度</text>
  <path d="M500 58 H1160" stroke="#475569" stroke-width="2"/>

  <rect x="500" y="72" width="660" height="70" rx="10" fill="#334155"/>
  <text x="514" y="116" font-size="22" font-weight="bold" fill="#2dd4bf">a と b</text>
  <text x="700" y="116" font-size="21" fill="#e2e8f0">同じ向き（長さは2倍）</text>
  <text x="1060" y="118" font-size="30" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <rect x="500" y="156" width="660" height="70" rx="10" fill="#334155"/>
  <text x="514" y="200" font-size="22" font-weight="bold" fill="#f59e0b">a と c</text>
  <text x="700" y="200" font-size="21" fill="#e2e8f0">直交（90度ずれている）</text>
  <text x="1060" y="202" font-size="30" font-weight="bold" fill="white" text-anchor="middle">0</text>

  <rect x="500" y="240" width="660" height="70" rx="10" fill="#334155"/>
  <text x="514" y="284" font-size="22" font-weight="bold" fill="#f472b6">a と d</text>
  <text x="700" y="284" font-size="21" fill="#e2e8f0">反対向き</text>
  <text x="1060" y="286" font-size="30" font-weight="bold" fill="white" text-anchor="middle">-1</text>
</svg>
