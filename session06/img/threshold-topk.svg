<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="370" viewBox="0 0 1160 370"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 値 v の高さ: y = 300 - 400 * v -->

  <!-- ===== 左: 関係する資料がある質問 ===== -->
  <text x="0" y="22" font-size="18" font-weight="bold" fill="#e2e8f0">資料に関係する質問</text>
  <text x="190" y="22" font-size="15" fill="#94a3b8">類似度の大きい順に8件（説明用の値）</text>

  <!-- 軸 -->
  <path d="M56 60 V300 H700" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="48" y="305" text-anchor="end" font-size="14" fill="#94a3b8">0</text>
  <text x="48" y="65" text-anchor="end" font-size="14" fill="#94a3b8">0.6</text>

  <!-- しきい値の線（棒の後ろに描く） -->
  <path d="M56 180 H700" stroke="#fcd34d" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- 1〜3位: 渡る -->
  <path d="M70 300 V96 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#3b82f6"/>
  <path d="M148 300 V116 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#3b82f6"/>
  <path d="M226 300 V140 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#3b82f6"/>
  <!-- 4〜5位: 0.3以上だが TOP_K で落ちる -->
  <path d="M304 300 V160 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#64748b"/>
  <path d="M382 300 V180 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#64748b"/>
  <!-- 6〜8位: しきい値未満 -->
  <path d="M460 300 V196 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M538 300 V216 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M616 300 V232 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 値 -->
  <g font-size="15" font-weight="bold" fill="white" text-anchor="middle">
    <text x="97" y="114">0.52</text>
    <text x="175" y="134">0.47</text>
    <text x="253" y="158">0.41</text>
    <text x="331" y="178">0.36</text>
    <text x="409" y="198">0.31</text>
    <text x="487" y="214">0.27</text>
    <text x="565" y="234">0.22</text>
    <text x="643" y="250">0.18</text>
  </g>
  <!-- 順位 -->
  <g font-size="15" fill="#94a3b8" text-anchor="middle">
    <text x="97" y="322">1位</text>
    <text x="175" y="322">2位</text>
    <text x="253" y="322">3位</text>
    <text x="331" y="322">4位</text>
    <text x="409" y="322">5位</text>
    <text x="487" y="322">6位</text>
    <text x="565" y="322">7位</text>
    <text x="643" y="322">8位</text>
  </g>

  <!-- しきい値の線 -->
  <text x="466" y="166" font-size="17" font-weight="bold" fill="#fcd34d">MIN_SIMILARITY = 0.3</text>

  <!-- TOP_K の括弧 -->
  <path d="M70 66 V56 H280 V66" stroke="#93c5fd" stroke-width="3" fill="none"/>
  <text x="292" y="64" font-size="17" font-weight="bold" fill="#93c5fd">TOP_K = 3：上から3件まで</text>

  <!-- ===== 右: 資料に無い話題 ===== -->
  <text x="760" y="22" font-size="18" font-weight="bold" fill="#e2e8f0">資料に無い話題</text>
  <text x="900" y="22" font-size="15" fill="#94a3b8">（説明用の値）</text>

  <path d="M776 60 V300 H1150" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M776 180 H1150" stroke="#fcd34d" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M792 300 V200 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M870 300 V212 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M948 300 V220 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M1026 300 V228 a4 4 0 0 1 4 -4 h46 a4 4 0 0 1 4 4 V300 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="15" font-weight="bold" fill="white" text-anchor="middle">
    <text x="819" y="218">0.26</text>
    <text x="897" y="230">0.23</text>
    <text x="975" y="238">0.21</text>
    <text x="1053" y="246">0.19</text>
  </g>
  <g font-size="15" fill="#94a3b8" text-anchor="middle">
    <text x="819" y="322">1位</text>
    <text x="897" y="322">2位</text>
    <text x="975" y="322">3位</text>
    <text x="1053" y="322">4位</text>
  </g>
  <text x="792" y="96" font-size="19" font-weight="bold" fill="#e2e8f0">0件 → 回答のAPIを呼ばない</text>
  <text x="792" y="124" font-size="16" fill="#cbd5e1">しきい値が無いと、上位3件が渡ってしまう</text>

  <!-- 凡例 -->
  <rect x="56" y="342" width="20" height="20" rx="4" fill="#3b82f6"/>
  <text x="84" y="358" font-size="16" fill="#e2e8f0">LLMに渡る</text>
  <rect x="210" y="342" width="20" height="20" rx="4" fill="#64748b"/>
  <text x="238" y="358" font-size="16" fill="#e2e8f0">0.3以上だが、4位以下（TOP_K で落ちる）</text>
  <rect x="590" y="342" width="20" height="20" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="618" y="358" font-size="16" fill="#e2e8f0">0.3未満（しきい値で落ちる）</text>
</svg>
