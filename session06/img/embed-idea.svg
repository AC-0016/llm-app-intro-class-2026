<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="300" viewBox="0 0 1160 300"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 文章 -->
  <text x="0" y="20" font-size="16" fill="#94a3b8">文章</text>
  <rect x="0" y="32" width="330" height="62" rx="12" fill="#0f766e"/>
  <text x="16" y="70" font-size="19" fill="white">LLMは前の会話を覚えていない</text>
  <rect x="0" y="110" width="330" height="62" rx="12" fill="#1e40af"/>
  <text x="16" y="148" font-size="19" fill="white">LLMは前の話を忘れる</text>
  <rect x="0" y="188" width="330" height="62" rx="12" fill="#b45309"/>
  <text x="16" y="226" font-size="19" fill="white">校庭の桜はいつ咲く？</text>

  <!-- Embeddingモデル -->
  <path d="M338 141 H372" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="386,141 370,131 370,151" fill="#93c5fd"/>
  <rect x="390" y="80" width="190" height="122" rx="12" fill="#334155"/>
  <text x="485" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="white">Embedding</text>
  <text x="485" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="white">モデル</text>
  <text x="485" y="180" text-anchor="middle" font-size="14" fill="#cbd5e1">text-embedding-3-small</text>
  <path d="M588 141 H614" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="628,141 612,131 612,151" fill="#93c5fd"/>

  <!-- ベクトル -->
  <text x="636" y="20" font-size="16" fill="#94a3b8">ベクトル（1536個の数値）</text>
  <rect x="636" y="32" width="250" height="62" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <text x="652" y="70" font-size="18" fill="#e2e8f0">[0.021, -0.013, …]</text>
  <rect x="636" y="110" width="250" height="62" rx="12" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <text x="652" y="148" font-size="18" fill="#e2e8f0">[0.019, -0.010, …]</text>
  <rect x="636" y="188" width="250" height="62" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="652" y="226" font-size="18" fill="#e2e8f0">[-0.008, 0.032, …]</text>

  <!-- 向きのイメージ -->
  <text x="912" y="20" font-size="16" fill="#94a3b8">向きのイメージ</text>
  <rect x="906" y="32" width="254" height="218" rx="12" fill="#1e293b"/>
  <circle cx="946" cy="226" r="4" fill="#94a3b8"/>
  <!-- 覚えていない -->
  <path d="M946 226 L1124 140" stroke="#2dd4bf" stroke-width="4" fill="none"/>
  <polygon points="1136,134 1118,133 1125,148" fill="#2dd4bf"/>
  <!-- 忘れる -->
  <path d="M946 226 L1110 110" stroke="#60a5fa" stroke-width="4" fill="none"/>
  <polygon points="1121,102 1103,104 1112,118" fill="#60a5fa"/>
  <!-- 桜 -->
  <path d="M946 226 L930 70" stroke="#f59e0b" stroke-width="4" fill="none"/>
  <polygon points="929,56 921,72 938,71" fill="#f59e0b"/>
  <text x="1040" y="98" font-size="16" fill="#e2e8f0">近い向き</text>
  <text x="950" y="62" font-size="16" fill="#e2e8f0">離れた向き</text>

  <text x="0" y="288" font-size="16" fill="#94a3b8">説明用の図です。数値と向きは実際の値ではありません。</text>
</svg>
