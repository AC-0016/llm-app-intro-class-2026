<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="420" viewBox="0 0 1160 420"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 1回目 -->
  <rect x="2" y="2" width="476" height="414" rx="14" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="22" y="38" font-size="22" font-weight="bold" fill="#93c5fd">1回目の呼び出し</text>
  <text x="460" y="38" text-anchor="end" font-size="16" fill="#94a3b8">llm.py 116〜125行</text>

  <text x="22" y="76" font-size="17" fill="#94a3b8">input（history）</text>
  <rect x="22" y="88" width="436" height="44" rx="8" fill="#b45309"/>
  <text x="38" y="117" font-size="18" fill="white">user：まだ終わっていない作業は？</text>

  <text x="22" y="166" font-size="17" fill="#94a3b8">tools</text>
  <rect x="22" y="176" width="436" height="44" rx="8" fill="#1e40af"/>
  <text x="38" y="205" font-size="18" fill="white">TOOLS：3つの関数の説明</text>

  <text x="22" y="256" font-size="17" fill="#94a3b8">出力（first.output）</text>
  <rect x="22" y="268" width="436" height="72" rx="8" fill="#334155"/>
  <text x="38" y="297" font-size="18" fill="white">function_call　get_tasks</text>
  <text x="38" y="327" font-size="16" fill="#fcd34d">{"status": "todo"}　call_id: call_01</text>

  <text x="22" y="384" font-size="16" fill="#94a3b8">この時点では、まだDBを読んでいない</text>

  <!-- 中央の矢印 -->
  <text x="580" y="150" text-anchor="middle" font-size="17" fill="white">Pythonが確かめて</text>
  <text x="580" y="174" text-anchor="middle" font-size="17" fill="white">実行し、結果を</text>
  <path d="M482 196 H662" stroke="#5eead4" stroke-width="4" fill="none"/>
  <polygon points="678,196 662,186 662,206" fill="#5eead4"/>
  <text x="580" y="230" text-anchor="middle" font-size="17" fill="white">history に足す</text>
  <text x="580" y="256" text-anchor="middle" font-size="15" fill="#94a3b8">130〜142行</text>

  <!-- 2回目 -->
  <rect x="682" y="2" width="476" height="414" rx="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="702" y="38" font-size="22" font-weight="bold" fill="#fcd34d">2回目の呼び出し</text>
  <text x="1140" y="38" text-anchor="end" font-size="16" fill="#94a3b8">llm.py 151〜158行</text>

  <text x="702" y="76" font-size="17" fill="#94a3b8">input（history）</text>
  <rect x="702" y="86" width="436" height="38" rx="8" fill="#b45309"/>
  <text x="718" y="112" font-size="17" fill="white">user：まだ終わっていない作業は？</text>
  <rect x="702" y="130" width="436" height="38" rx="8" fill="#334155"/>
  <text x="718" y="156" font-size="17" fill="white">function_call　get_tasks（<tspan fill="#fcd34d">call_01</tspan>）</text>
  <rect x="702" y="174" width="436" height="62" rx="8" fill="#0f766e"/>
  <text x="718" y="200" font-size="17" fill="white">function_call_output（<tspan fill="#fcd34d">call_01</tspan>）</text>
  <text x="718" y="225" font-size="16" fill="#ccfbf1">output：id 4・5・6 の3件のJSON</text>

  <text x="702" y="268" font-size="17" fill="#94a3b8">tools</text>
  <rect x="702" y="278" width="436" height="40" rx="8" fill="#475569"/>
  <text x="718" y="305" font-size="17" fill="white">渡さない → これ以上、関数は呼ばれない</text>

  <text x="702" y="350" font-size="17" fill="#94a3b8">出力（final.output_text）</text>
  <rect x="702" y="360" width="436" height="44" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="718" y="389" font-size="17" fill="white">回答文：未完了は3件です。…</text>
</svg>
