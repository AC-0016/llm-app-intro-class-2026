<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="320" viewBox="0 0 1160 320"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- 左：組み合わせた -->
  <text x="290" y="28" text-anchor="middle" font-size="24" font-weight="bold" fill="#86efac">組み合わせた（レベル3）</text>
  <rect x="0" y="45" width="580" height="270" rx="14" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="20" y="80" font-size="18" fill="#cbd5e1">1つのアプリ：your-app/keyword-app/main.py</text>

  <rect x="20" y="105" width="90" height="70" rx="10" fill="#b45309"/>
  <text x="65" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="white">質問</text>
  <path d="M112 140 H136" stroke="#93c5fd" stroke-width="4"/>
  <polygon points="148,140 134,131 134,149" fill="#93c5fd"/>

  <rect x="150" y="100" width="190" height="80" rx="10" fill="#0f766e"/>
  <text x="245" y="133" text-anchor="middle" font-size="18" font-weight="bold" fill="white">search.py</text>
  <text x="245" y="160" text-anchor="middle" font-size="15" fill="#ccfbf1">keyword-app 由来</text>
  <path d="M342 140 H366" stroke="#93c5fd" stroke-width="4"/>
  <polygon points="378,140 364,131 364,149" fill="#93c5fd"/>

  <rect x="380" y="100" width="180" height="80" rx="10" fill="#6d28d9"/>
  <text x="470" y="133" text-anchor="middle" font-size="17" font-weight="bold" fill="white">ask_with_tools()</text>
  <text x="470" y="160" text-anchor="middle" font-size="15" fill="#ede9fe">progress-app 由来</text>

  <path d="M470 182 V220" stroke="#93c5fd" stroke-width="4"/>
  <polygon points="470,232 461,218 479,218" fill="#93c5fd"/>
  <rect x="150" y="234" width="410" height="60" rx="10" fill="#334155"/>
  <text x="355" y="270" text-anchor="middle" font-size="18" fill="white">資料と関数の結果をもとに、1つの回答</text>

  <!-- 右：並べただけ -->
  <text x="870" y="28" text-anchor="middle" font-size="24" font-weight="bold" fill="#fca5a5">並べただけ（レベル3にならない）</text>
  <rect x="620" y="45" width="540" height="270" rx="14" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7"/>

  <rect x="650" y="90" width="220" height="110" rx="10" fill="#0f766e"/>
  <text x="760" y="135" text-anchor="middle" font-size="20" font-weight="bold" fill="white">keyword-app</text>
  <text x="760" y="170" text-anchor="middle" font-size="17" fill="#ccfbf1">ポート8001</text>

  <rect x="910" y="90" width="220" height="110" rx="10" fill="#6d28d9"/>
  <text x="1020" y="135" text-anchor="middle" font-size="20" font-weight="bold" fill="white">progress-app</text>
  <text x="1020" y="170" text-anchor="middle" font-size="17" fill="#ede9fe">ポート8003</text>

  <text x="890" y="152" text-anchor="middle" font-size="28" fill="#fca5a5">×</text>
  <text x="890" y="250" text-anchor="middle" font-size="18" fill="#e2e8f0">それぞれ別に質問する。仕組みはつながっていない</text>
</svg>
