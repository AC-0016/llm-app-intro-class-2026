<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="300" viewBox="0 0 1160 300"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- ファイルの流れ -->
  <rect x="0" y="10" width="190" height="100" rx="12" fill="#334155"/>
  <text x="95" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="white">ブラウザ</text>
  <text x="95" y="85" text-anchor="middle" font-size="17" fill="#cbd5e1">static/app.js</text>

  <path d="M192 60 H228" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="240,60 226,51 226,69" fill="#93c5fd"/>

  <rect x="242" y="10" width="190" height="100" rx="12" fill="#1e40af"/>
  <text x="337" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="white">main.py</text>
  <text x="337" y="85" text-anchor="middle" font-size="17" fill="#dbeafe">質問を受け取る</text>

  <path d="M434 60 H470" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="482,60 468,51 468,69" fill="#93c5fd"/>

  <rect x="484" y="10" width="190" height="100" rx="12" fill="#0f766e"/>
  <text x="579" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="white">検索・関数</text>
  <text x="579" y="85" text-anchor="middle" font-size="16" fill="#ccfbf1">search.py など</text>

  <path d="M676 60 H712" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="724,60 710,51 710,69" fill="#93c5fd"/>

  <rect x="726" y="10" width="190" height="100" rx="12" fill="#b45309"/>
  <text x="821" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="white">llm.py</text>
  <text x="821" y="85" text-anchor="middle" font-size="17" fill="#fef3c7">input に入れて送る</text>

  <path d="M918 60 H954" stroke="#93c5fd" stroke-width="4" fill="none"/>
  <polygon points="966,60 952,51 952,69" fill="#93c5fd"/>

  <rect x="968" y="10" width="190" height="100" rx="12" fill="#475569"/>
  <text x="1063" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="white">LLM API</text>
  <text x="1063" y="85" text-anchor="middle" font-size="17" fill="#e2e8f0">回答を返す</text>

  <!-- 説明できること -->
  <rect x="0" y="140" width="1158" height="42" rx="8" fill="#1e3a8a"/>
  <text x="20" y="168" font-size="19" font-weight="bold" fill="#bfdbfe">第3回</text>
  <text x="110" y="168" font-size="19" fill="white">質問が通るファイルの順番を、自分のアプリで言える</text>

  <rect x="484" y="192" width="432" height="42" rx="8" fill="#115e59"/>
  <text x="500" y="220" font-size="19" font-weight="bold" fill="#99f6e4">第4〜7回</text>
  <text x="600" y="220" font-size="18" fill="white">結果がどこで input に入るか</text>

  <rect x="0" y="244" width="916" height="42" rx="8" fill="#713f12"/>
  <text x="20" y="272" font-size="19" font-weight="bold" fill="#fde68a">第8回</text>
  <text x="110" y="272" font-size="19" fill="white">安全対策の5か所（入力の確認、表示、SQL、関数の確認、エラーの文）を指せる</text>
</svg>
