<svg xmlns="http://www.w3.org/2000/svg"
     width="1160" height="330" viewBox="0 0 1160 330"
     font-family="'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">

  <!-- レベル1 -->
  <rect x="0" y="170" width="280" height="150" rx="12" fill="#0f766e"/>
  <text x="18" y="205" font-size="25" font-weight="bold" fill="white">レベル1</text>
  <text x="18" y="240" font-size="19" fill="white">Webアプリ1つを</text>
  <text x="18" y="266" font-size="19" fill="white">書き換えた</text>
  <text x="18" y="300" font-size="16" fill="#ccfbf1">指示文・画面・資料を題材に</text>

  <!-- レベル2 -->
  <rect x="293" y="120" width="280" height="200" rx="12" fill="#1e40af"/>
  <text x="311" y="155" font-size="25" font-weight="bold" fill="white">レベル2</text>
  <text x="311" y="190" font-size="19" fill="white">1つに新しい機能を</text>
  <text x="311" y="216" font-size="19" fill="white">付けた</text>
  <text x="311" y="250" font-size="16" fill="#dbeafe">エンドポイントか</text>
  <text x="311" y="273" font-size="16" fill="#dbeafe">画面の操作が増えて動く</text>

  <!-- レベル3 -->
  <rect x="586" y="70" width="280" height="250" rx="12" fill="#6d28d9"/>
  <text x="604" y="105" font-size="25" font-weight="bold" fill="white">レベル3</text>
  <text x="604" y="140" font-size="19" fill="white">組み合わせて</text>
  <text x="604" y="166" font-size="19" fill="white">アプリを作った</text>
  <text x="604" y="200" font-size="16" fill="#ede9fe">2つ以上のsample-appの</text>
  <text x="604" y="223" font-size="16" fill="#ede9fe">仕組みが1つのアプリで連携</text>

  <!-- 発展 -->
  <rect x="879" y="20" width="280" height="300" rx="12" fill="#b45309"/>
  <text x="897" y="55" font-size="25" font-weight="bold" fill="white">さらに発展</text>
  <text x="897" y="90" font-size="19" fill="white">教材の範囲以外も</text>
  <text x="897" y="116" font-size="19" fill="white">入れた</text>
  <text x="897" y="150" font-size="16" fill="#fef3c7">画像入力、ストリーミング、</text>
  <text x="897" y="173" font-size="16" fill="#fef3c7">認証、デプロイなど。</text>
  <text x="897" y="196" font-size="16" fill="#fef3c7">調べたことをREADMEに</text>

  <!-- まずレベル1 -->
  <path d="M20 140 Q20 70 140 70 H520" stroke="#fcd34d" stroke-width="3" fill="none" stroke-dasharray="7 6"/>
  <polygon points="536,70 518,61 518,79" fill="#fcd34d"/>
  <text x="40" y="58" font-size="19" fill="#fcd34d">レベル1で動いてプッシュしてから、上へ</text>
</svg>
