<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授業資料アシスタント</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <header><p class="eyebrow">LLM APP INTRO / 2026</p><h1>授業資料アシスタント</h1>
  <p>資料を調べ、根拠を確認しながら学ぶ。</p></header>
  <p>質問と参照資料を外部APIへ送信します。</p>
  <form id="question-form">
    <label for="mode">回答の方式</label>
    <select id="mode">
      <option value="plain">資料なし</option>
      <option value="keyword" selected>キーワード検索（Janome）</option>
      <option value="tools">課題DB（架空データ）</option>
    </select>
    <label for="question">質問</label>
    <textarea id="question" maxlength="500" required rows="3" placeholder="SQLiteにデータを保存するには？"></textarea>
    <div id="search-options">
      <label for="top-k">検索結果の上位件数</label>
      <select id="top-k"><option>1</option><option selected>3</option><option>5</option></select>
    </div>
    <button id="send-button" type="submit">質問する</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section aria-labelledby="answer-title"><h2 id="answer-title">回答</h2><div id="answer">質問すると、ここに回答が表示されます。</div></section>
  <section id="sources-section"><h2>LLMに渡した資料</h2><p>回答の引用IDと本文を照合してください。資料があるだけで正答とは限りません。</p><ul id="sources"></ul></section>
  <details id="debug-section"><summary>学習用：送った資料と実行結果</summary><pre id="debug"></pre></details>
  <footer>教材用・1問ずつ回答します。個人情報や秘密情報を入力しないでください。</footer>
</main>
</body>
</html>
